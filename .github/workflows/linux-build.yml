name: Linux build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      PROTOC: /usr/bin/protoc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure telephony_plus exists
        run: |
          if [ ! -f telephony_plus/pubspec.yaml ]; then
            rm -rf telephony_plus
            git clone https://github.com/OpenBubbles/telephony_plus.git telephony_plus
          fi
          test -f telephony_plus/pubspec.yaml

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            git \
            unzip \
            xz-utils \
            zip \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            libgtk-3-dev \
            libglib2.0-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libnotify-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libmpv-dev \
            mpv \
            protobuf-compiler

      - name: Verify protoc
        run: |
          which protoc
          protoc --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      - name: Tool versions
        run: |
          flutter --version
          dart --version
          rustc --version
          cargo --version
          java -version
          cmake --version
          pkg-config --version

      - name: Clear Cargo lock files
        run: |
          rm -f ~/.cargo/.package-cache || true
          rm -f ~/.cargo/.global-cache || true

      - name: Patch pubspec for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()

          removals = [
              "  build_verify: ^3.1.0\n",
              "  flutter_launcher_icons: ^0.13.1\n",
              "  flutter_native_splash: ^2.4.0\n",
              "  peanut: ^5.0.0\n",
              "  freezed: ^2.4.1\n",
          ]
          for r in removals:
              s = s.replace(r, "")

          s = s.replace("open_filex: ^4.4.0", "open_filex: ^4.7.0")

          p.write_text(s)
          print("Patched pubspec.yaml for CI")
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build Linux app
        run: |
          chmod +x ./linux/build.sh
          ./linux/build.sh

      - name: Collect likely outputs
        if: always()
        run: |
          mkdir -p artifact
          find . \
            \( -path "*/build/linux/x64/release/bundle/*" \
            -o -path "*/build/linux/*/release/bundle/*" \
            -o -path "*/linux/output/*" \
            -o -path "*/dist/*" \
            -o -path "*/target/release/*" \) \
            -type f -exec cp --parents {} artifact/ \; || true
          find artifact -type f | sort || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-linux-build
          path: artifact
          if-no-files-found: warn
