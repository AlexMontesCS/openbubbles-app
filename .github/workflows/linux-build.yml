name: Linux build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            git \
            unzip \
            xz-utils \
            zip \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Make build script executable
        run: chmod +x ./linux/build.sh

      - name: Run repo build script
        run: ./linux/build.sh

      - name: Collect likely outputs
        run: |
          mkdir -p artifact
          find . \
            \( -path "*/build/linux/x64/release/bundle/*" \
            -o -path "*/build/linux/*/release/bundle/*" \
            -o -path "*/linux/output/*" \
            -o -path "*/dist/*" \) \
            -type f -exec cp --parents {} artifact/ \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbubbles-linux-build
          path: artifact
          if-no-files-found: warn
